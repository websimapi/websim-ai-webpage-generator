<!DOCTYPE html>
<html>
<head>
    <title>AI Webpage Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/websim/dist/websim.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1a1a1d;
            --primary-color: #4b5d8a;
            --secondary-color: #c5c6c7;
            --accent-color: #66fcf1;
            --text-color: #f0f0f0;
            --border-radius: 8px;
        }

        body {
            font-family: 'Roboto Mono', monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            overflow: hidden;
        }

        #root {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: calc(100vh - 4rem);
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            height: 100%;
        }

        .prompt-form {
            display: flex;
            gap: 1rem;
        }

        .prompt-input {
            flex-grow: 1;
            padding: 0.75rem 1rem;
            background-color: var(--primary-color);
            border: 2px solid var(--secondary-color);
            border-radius: var(--border-radius);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .prompt-input:focus {
            border-color: var(--accent-color);
        }

        .prompt-submit {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-color);
            border: none;
            border-radius: var(--border-radius);
            color: var(--bg-color);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .prompt-submit:hover {
            background-color: #45a29e;
        }
        
        .prompt-submit:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .loading-bar-container {
            height: 2rem;
            background-color: var(--primary-color);
            border-radius: var(--border-radius);
            overflow: hidden;
            position: relative;
        }
        
        .loading-bar-progress {
            width: 0;
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.5s ease-in-out;
            display: flex;
            align-items: center;
        }

        .loading-bar-text-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            overflow: hidden;
            color: var(--bg-color);
            font-weight: bold;
        }

        .loading-bar-text {
            white-space: nowrap;
            padding-left: 1rem;
            padding-right: 1rem;
            animation: none;
        }
        
        .loading-bar-container:hover .loading-bar-text {
            animation: scrollText 10s linear infinite;
        }
        
        @keyframes scrollText {
            from { transform: translateX(0%); }
            to { transform: translateX(-50%); }
        }

        .prompt-list-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-content: flex-start;
            overflow-y: auto;
            flex-grow: 1;
            padding: 0.5rem;
        }
        
        .prompt-item {
            padding: 0.75rem 1.25rem;
            background-color: var(--primary-color);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
        }

        .prompt-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }
        
        .generated-page-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #fff;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .generated-page-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-button {
            position: fixed;
            top: 1rem;
            left: 1rem;
            width: 3rem;
            height: 3rem;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            z-index: 1001;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            transition: all 0.3s;
        }

        .close-button:hover {
            background: rgba(0, 0, 0, 0.8);
            transform: scale(1.1);
        }

    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="script.js"></script>

</body>
</html>
